name: Controleer handtekeningen

on:
  pull_request:
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-liberation fonts-urw-base35
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Maak huisstijlfonts beschikbaar voor de controles
        run: python -c "from genereer import zorg_voor_fonts; zorg_voor_fonts()"
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-controle
          path: test-results/
