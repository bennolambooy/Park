name: Ververs handtekening

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "park/**"
      - "assets/**"
      - "genereer.py"
      - "requirements.txt"
      - "sjabloon_index.html"
      - "docs/js/**"
      - "docs/assets/**"
      - "docs/admin.html"
      - "docs/beheer.html"
      - ".github/workflows/ververs.yml"

concurrency:
  group: handtekening-productie
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ververs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Installeer afhankelijkheden
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-urw-base35
          pip install -r requirements.txt
      - name: Controleer gegevensverwerking
        run: |
          python -m unittest discover -s tests -v
          npm test
      - name: Cache huisstijlfonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: gt-walsheim-v1
      - name: Genereer handtekeningen en persoonlijke pagina
        run: python genereer.py
      - name: Bewaar de gegenereerde versie
        run: |
          git config user.name "park-handtekening"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Handtekening ververst $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publiceer:
    needs: ververs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer de nieuwe handtekeningen
        id: deployment
        uses: actions/deploy-pages@v4
