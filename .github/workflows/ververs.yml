name: Ververs handtekening

on:
  schedule:
    - cron: "30 4 * * *"   # elke ochtend 06:30 NL-zomertijd / 05:30 wintertijd
  workflow_dispatch:        # en handmatig te starten via de Actions-tab

concurrency:
  group: handtekening
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ververs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer Pillow
        run: pip install pillow

      - name: Genereer handtekening
        run: python genereer.py

      - name: Commit en push als er iets veranderd is
        run: |
          git config user.name "park-handtekening"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Handtekening ververst $(date -u +%F)"
            git pull --rebase
            git push
          fi
